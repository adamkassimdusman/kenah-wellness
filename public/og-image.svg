<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background with subtle warm gradient -->
  <rect width="1200" height="630" fill="#0B2B26"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg-gradient)" opacity="0.95"/>
  
  <!-- Decorative arcs -->
  <circle cx="1100" cy="150" r="320" stroke="#E89A24" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="1100" cy="150" r="260" stroke="#3CB9A8" stroke-width="3" stroke-opacity="0.25"/>
  <circle cx="100" cy="550" r="220" stroke="#F2D701" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Content Container -->
  <g transform="translate(100, 120)">
    <!-- Pill Badge -->
    <rect width="360" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.12" stroke="#E89A24" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#E89A24"/>
    <text x="42" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CANONSBURG &amp; GREATER PITTSBURGH, PA</text>

    <!-- Headline -->
    <text x="0" y="120" fill="#FFFFFF" font-family="sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
      Kenah Wellness Services
    </text>
    <text x="0" y="185" fill="#E89A24" font-family="sans-serif" font-size="44" font-weight="700">
      Caring Beyond the Call
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="250" fill="#E2E8F0" font-family="sans-serif" font-size="24" font-weight="400">
      Compassionate Home Care &amp; Pennsylvania ODP Waiver Services
    </text>
    <text x="0" y="285" fill="#94A3B8" font-family="sans-serif" font-size="20" font-weight="400">
      Senior Care • In-Home Respite • Dementia Care • Community Participation (CPS)
    </text>

    <!-- Trust Badges -->
    <g transform="translate(0, 340)">
      <rect width="210" height="48" rx="24" fill="#E89A24"/>
      <text x="105" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">
        Free Care Assessment
      </text>

      <rect x="230" y="0" width="240" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="350" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600" text-anchor="middle">
        Call +1 (412) 546-1860
      </text>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <radialGradient id="bg-gradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 200) rotate(45) scale(800 600)">
      <stop offset="0%" stop-color="#0E3D36"/>
      <stop offset="100%" stop-color="#071E1A"/>
    </radialGradient>
  </defs>
</svg>
